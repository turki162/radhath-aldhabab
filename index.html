<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشتل رذاذ الضباب — سماد الحياة</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --fog: #e8f0ec;
  --mist: #c5d9cc;
  --deep: #1a2e24;
  --forest: #234733;
  --pine: #2e5e42;
  --fern: #3d7a55;
  --dew: #6aab7e;
  --gold: #b8913a;
  --amber: #d4a843;
  --cream: #f7f2e8;
  --white: #fdfcf9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
  background: var(--deep);
  color: var(--fog);
  font-family: 'Tajawal', sans-serif;
  overflow-x: hidden;
}

/* HERO */
.hero {
  background-color: #1a2e24;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 60px 30px;
}

/* Fog */
.fog-layer,
.dew-drops {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.fog-layer::before {
  content: '';
  position: absolute;
  bottom: -40px;
  left: -10%;
  width: 120%;
  height: 55%;
  background: radial-gradient(ellipse at 50% 100%, rgba(197,217,204,0.18) 0%, rgba(197,217,204,0.06) 50%, transparent 70%);
  border-radius: 50%;
  animation: fogRise 8s ease-in-out infinite alternate;
}

.fog-layer::after {
  content: '';
  position: absolute;
  top: -20%;
  right: -10%;
  width: 80%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(106,171,126,0.07) 0%, transparent 65%);
  animation: fogDrift 12s ease-in-out infinite alternate;
}

@keyframes fogRise {
  from { transform: translateY(10px) scaleX(1); opacity: 0.7; }
  to   { transform: translateY(-10px) scaleX(1.02); opacity: 1; }
}

@keyframes fogDrift {
  from { transform: translate(0, 0); }
  to   { transform: translate(-20px, 15px); }
}

.drop {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(197,217,204,0.2));
  animation: dewFloat var(--dur, 6s) ease-in-out infinite alternate;
}

@keyframes dewFloat {
  from { transform: translate(0,0); opacity: var(--op1, 0.3); }
  to   { transform: translate(var(--tx, 5px), var(--ty, -8px)); opacity: var(--op2, 0.6); }
}

/* Brand */
.brand-arabic {
  font-size: clamp(42px, 10vw, 88px);
  font-weight: 900;
  color: var(--white);
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 6px;
}

.brand-arabic span { color: var(--dew); }

.brand-latin {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(16px, 3vw, 22px);
  color: var(--mist);
  letter-spacing: 4px;
  margin-bottom: 30px;
  opacity: 0.7;
}

.hero-tagline {
  font-size: clamp(14px, 2vw, 17px);
  font-weight: 300;
  color: rgba(197,217,204,0.8);
  max-width: 480px;
  line-height: 1.9;
  margin-bottom: 48px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(106,171,126,0.15);
  border: 1px solid rgba(106,171,126,0.35);
  border-radius: 40px;
  padding: 10px 22px;
  font-size: 13px;
  color: var(--dew);
  letter-spacing: 2px;
}

.scroll-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(197,217,204,0.4);
  font-size: 11px;
  letter-spacing: 3px;
  animation: bounce 2s infinite;
}

.scroll-hint::after { content: '↓'; }

@keyframes bounce {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(6px); }
}

/* باقي الأقسام بدون تغيير (تم إصلاح الأخطاء فقط) */
.quality-section { background: var(--cream); padding: 100px 30px; }
.section-title { color: var(--deep); }
.section-label { color: var(--fern); }
.section-sub { color: rgba(26,46,36,0.5); }

.journey-section { background: var(--deep); padding: 100px 30px; }
.step h4 { color: var(--fog); }
.step p { color: rgba(232,240,236,0.45); }

.brand-footer {
  background: var(--deep);
  padding: 60px 30px 40px;
  text-align: center;
}

.footer-logo { font-size: 28px; font-weight: 900; color: var(--white); }
.footer-logo span { color: var(--dew); }

.footer-tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: rgba(197,217,204,0.45);
}
</style>
</head>

<body>

<section class="hero">
  <div class="fog-layer"></div>
  <div class="dew-drops" id="dew"></div>

  <div class="hero-brand">
    <div class="brand-arabic">مشتل <span>رذاذ</span><br>الضباب</div>
    <div class="brand-latin">Rathath Al-Dhabab Nursery</div>

    <p class="hero-tagline">
      سماد عضوي حي — ينبثق من قلب الطبيعة الجبلية<br>
      يُغذّي تربتك من الجذور، لا من السطح
    </p>

    <div class="hero-badge">
      🌿 &nbsp; Vermicompost Premium · عضوي 100%
    </div>
  </div>

  <div class="scroll-hint">اكتشف الفرق</div>
</section>

<footer class="brand-footer">
  <div class="footer-logo">مشتل <span>رذاذ الضباب</span></div>
  <div class="footer-tagline">Where the mountain breathes life into soil</div>
  <div class="footer-seal">🌿 &nbsp; PREMIUM VERMICOMPOST · قرية بحره</div>
</footer>

</body>
</html>
